name: Publish article

on:
  push:
    branches: [main]
    paths:
      - article/corpo.html
      - article/modelo.html
      - sim/**
      - data/**
      - out/blind-v10/**
      - out/blind-v8/second_review.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build article and PDF from corpo.html
        run: uv run python -m sim.article out/blind-v10 --repo https://github.com/CaiqueCoelho/brazil-ai-simulation --pdf
      - name: Assemble site
        run: |
          mkdir -p _site
          cp article/artigo.html _site/index.html
          cp article/artigo-ia-governa-brasil.pdf _site/
          cp article/og-image.png _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
